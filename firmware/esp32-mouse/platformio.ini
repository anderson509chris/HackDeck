[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Flash & RAM config for ESP32-S3R8 (16MB Flash, 8MB OPI PSRAM)
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv

; USB HID Mouse via native USB (no driver needed on Windows)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_HID_ON_BOOT=1

; Required libraries
; Install these via PlatformIO Library Manager:
;   - "Arduino_GFX_Library" by Moon On Our Nation
;   - "Adafruit GFX Library" (dependency)
lib_deps =
    moononournation/GFX Library for Arduino@^1.4.9
